<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
:root{--bg:#0d0f14;--surface:#151820;--card:#1c2030;--border:#2a3045;--gold:#f0b429;
      --green:#2ec4b6;--red:#e63946;--blue:#6eb5ff;--text:#e8eaf0;--muted:#6b7280}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
header{background:var(--surface);border-bottom:2px solid var(--gold);padding:14px 24px;display:flex;
       align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:'Bebas Neue';font-size:25px;letter-spacing:3px;color:var(--gold)}
.brand small{display:block;font-family:'Inter';font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.btn{padding:9px 18px;border-radius:5px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter'}
.btn-gold{background:var(--gold);color:#0d0f14}
.btn-out{background:transparent;color:var(--gold);border:1.5px solid var(--gold)}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.panel{padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border);
       display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.fld input,.fld select{padding:8px 11px;background:var(--card);border:1.5px solid var(--border);border-radius:5px;
       color:var(--text);font-family:'Inter';font-size:13px;outline:none;min-width:150px}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.seg{display:flex;border:1.5px solid var(--border);border-radius:5px;overflow:hidden}
.seg button{padding:8px 14px;background:transparent;border:none;color:var(--muted);cursor:pointer;
       font-size:12px;font-weight:600;font-family:'Inter'}
.seg button.on{background:var(--gold);color:#0d0f14}
#info{padding:10px 24px;font-size:12px;color:var(--muted);font-family:'JetBrains Mono';background:var(--card);
      display:flex;gap:18px;flex-wrap:wrap;align-items:center}
#info b{color:var(--gold)}

.wrap2{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 150px)}
.side{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.side h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:10px 0 7px}
.it{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:6px;cursor:pointer;
    border:1px solid transparent}
.it:hover{background:var(--card)}
.it.sel{background:rgba(240,180,41,.10);border-color:var(--gold)}
.it input{margin-top:2px;accent-color:var(--gold);width:15px;height:15px;flex:none}
.it .c{font-family:'JetBrains Mono';font-size:12px;font-weight:700;color:var(--gold);flex:none;width:56px}
.it .d{font-size:11.5px;line-height:1.35;color:var(--text)}
.it .g{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.vacio{padding:26px 12px;text-align:center;color:var(--muted);font-size:12px}
.prev{overflow-y:auto;background:var(--bg);padding:16px}

#sheet{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.lab{background:#fff;color:#000;border-radius:4px;padding:9px 9px 6px;text-align:center;
     border:1px solid #000;break-inside:avoid;page-break-inside:avoid;display:flex;
     flex-direction:column;justify-content:space-between;min-height:118px}
.lab .cat{font-family:'Inter';font-size:7.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
        padding:2px 0;margin-bottom:4px;border-radius:2px;background:#7a5b0d;color:#fff}
.lab .desc{font-family:'Inter';font-size:9.5px;font-weight:600;line-height:1.25;margin-bottom:5px;
        min-height:24px;display:flex;align-items:center;justify-content:center}
.lab svg{width:100%;height:38px;display:block}
.lab .code{font-family:'JetBrains Mono';font-weight:700;font-size:17px;letter-spacing:2px;margin-top:2px}
.lab .pie{font-family:'Inter';font-size:6.5px;color:#666;letter-spacing:.5px;margin-top:2px}

@media print{
  body{background:#fff}
  header,.panel,#info,.side,.noprint{display:none!important}
  .wrap2{display:block;height:auto}
  .prev{padding:0;overflow:visible}
  #sheet{padding:5mm;gap:3mm;grid-template-columns:repeat(3,1fr)}
  .lab{border:1px solid #999}
  @page{size:A4;margin:8mm}
}
</style>
</head>
<body>

<header>
  <div class="brand">🏷 ETIQUETAS DE SKU<small>Bodega Quinta — códigos de barras de producto</small></div>
  <div style="display:flex;gap:9px;flex-wrap:wrap">
    <button class="btn btn-out" id="btn-todos">Seleccionar todo lo filtrado</button>
    <button class="btn btn-ghost" id="btn-nada">Limpiar</button>
    <button class="btn btn-gold" id="btn-print">⬇ Imprimir / PDF</button>
  </div>
</header>

<div class="panel">
  <div class="fld"><label>Buscar código o nombre</label>
    <input id="q" placeholder="Ej: azucar, 104006…" style="min-width:260px"></div>
  <div class="fld"><label>Categoría</label><select id="cat"></select></div>
  <div class="fld"><label>Formato</label>
    <div class="seg">
      <button data-modo="catalogo" class="on">Catálogo</button>
      <button data-modo="adhesivo">Adhesivo</button>
    </div></div>
  <div class="fld" id="fld-copias" style="display:none"><label>Copias de cada uno</label>
    <input type="number" id="copias" value="4" min="1" max="60" style="min-width:100px"></div>
</div>

<div id="info"></div>

<div class="wrap2">
  <div class="side" id="lista"></div>
  <div class="prev"><div id="sheet"></div></div>
</div>

<script>
// ═══ CATÁLOGO DE SKU ═══════════════════════════════════════════════

// ── Catálogo activo: el cargado por el usuario manda sobre el de fábrica ──
var SKU_MAP = {};
function skuCargado(){
  try { var j = JSON.parse(localStorage.getItem('bq_sku') || 'null');
        return (j && j.length) ? j : null; } catch(e){ return null; }
}
function skuLista(){ return skuCargado() || SKU_BASE; }
function skuIndexar(){
  SKU_MAP = {};
  skuLista().forEach(function(r){ SKU_MAP[String(r[0]).toUpperCase().trim()] = { desc:r[1], cat:r[2] }; });
  return SKU_MAP;
}
// Devuelve {desc, cat} o null si ese código no está en el catálogo
function skuBuscar(codigo){
  if(!codigo) return null;
  return SKU_MAP[String(codigo).toUpperCase().trim()] || null;
}
skuIndexar();


var $ = function(id){ return document.getElementById(id); };
var MODO = 'catalogo';
var SEL = {};          // códigos elegidos
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function lista(){ return skuLista(); }

function categorias(){
  var m = {};
  lista().forEach(function(r){ m[r[2]||'(sin categoría)'] = (m[r[2]||'(sin categoría)']||0)+1; });
  return Object.keys(m).sort().map(function(k){ return [k, m[k]]; });
}

function pintarCategorias(){
  var sel = $('cat'), prev = sel.value;
  sel.innerHTML = '<option value="">Todas (' + lista().length + ')</option>'
    + categorias().map(function(c){
        return '<option value="' + esc(c[0]) + '">' + esc(c[0]) + ' (' + c[1] + ')</option>'; }).join('');
  if (prev) sel.value = prev;
}

function filtrados(){
  var q = $('q').value.toUpperCase().trim(), c = $('cat').value;
  return lista().filter(function(r){
    if (c && (r[2]||'(sin categoría)') !== c) return false;
    if (!q) return true;
    return String(r[0]).toUpperCase().indexOf(q) >= 0
        || String(r[1]).toUpperCase().indexOf(q) >= 0;
  });
}

function pintarLista(){
  var f = filtrados(), box = $('lista');
  if (!f.length){ box.innerHTML = '<div class="vacio">Ningún SKU coincide con la búsqueda.</div>'; pintarInfo(); return; }
  var porCat = {};
  f.forEach(function(r){ var k = r[2]||'(sin categoría)'; (porCat[k] = porCat[k] || []).push(r); });
  box.innerHTML = Object.keys(porCat).sort().map(function(k){
    return '<h3>' + esc(k) + ' · ' + porCat[k].length + '</h3>'
      + porCat[k].map(function(r){
          return '<label class="it ' + (SEL[r[0]] ? 'sel' : '') + '" data-c="' + esc(r[0]) + '">'
            + '<input type="checkbox" ' + (SEL[r[0]] ? 'checked' : '') + '>'
            + '<span class="c">' + esc(r[0]) + '</span>'
            + '<span class="d">' + esc(r[1]) + '</span></label>';
        }).join('');
  }).join('');
  box.querySelectorAll('.it').forEach(function(el){
    el.querySelector('input').addEventListener('change', function(e){
      if (e.target.checked) SEL[el.dataset.c] = 1; else delete SEL[el.dataset.c];
      el.classList.toggle('sel', !!SEL[el.dataset.c]);
      pintarHoja();
    });
  });
  pintarInfo();
}

function elegidos(){
  var m = {};
  lista().forEach(function(r){ if (SEL[r[0]]) m[r[0]] = r; });
  return Object.keys(m).sort(function(a,b){
    var A = m[a], B = m[b];
    return (A[2]||'').toUpperCase() < (B[2]||'').toUpperCase() ? -1
         : (A[2]||'').toUpperCase() > (B[2]||'').toUpperCase() ? 1
         : (a < b ? -1 : 1);
  }).map(function(k){ return m[k]; });
}

function pintarInfo(){
  var n = elegidos().length;
  var cop = MODO === 'adhesivo' ? Math.max(1, parseInt($('copias').value,10) || 1) : 1;
  var propio = !!skuCargado();
  $('info').innerHTML = (propio
      ? '📦 <b>' + lista().length + '</b> SKU <span style="color:var(--green)">(maestro cargado por ti)</span>'
      : '📦 <b>' + lista().length + '</b> SKU <span style="color:var(--muted)">(lista de fábrica — para actualizarla usa 🏷 SKU en el dashboard)</span>')
    + ' &nbsp;·&nbsp; 🔎 <b>' + filtrados().length + '</b> filtrados'
    + ' &nbsp;·&nbsp; ✅ <b>' + n + '</b> elegidos'
    + ' &nbsp;·&nbsp; 🖨 <b>' + (n*cop) + '</b> etiquetas'
    + ' &nbsp;·&nbsp; ' + Math.ceil((n*cop)/21) + ' hoja(s) A4';
}

function pintarHoja(){
  var els = elegidos();
  var cop = MODO === 'adhesivo' ? Math.max(1, parseInt($('copias').value,10) || 1) : 1;
  if (!els.length){
    $('sheet').innerHTML = '<div class="vacio" style="grid-column:1/-1">'
      + 'Elige SKU en la lista de la izquierda para ver aquí las etiquetas.</div>';
    pintarInfo(); return;
  }
  var html = '';
  els.forEach(function(r){
    for (var i=0;i<cop;i++){
      html += '<div class="lab">'
        + '<div class="cat">' + esc(r[2]||'SIN CATEGORÍA') + '</div>'
        + '<div class="desc">' + esc(r[1]) + '</div>'
        + '<svg data-code="' + esc(r[0]) + '"></svg>'
        + '<div class="code">' + esc(r[0]) + '</div>'
        + '<div class="pie">BODEGA QUINTA · CODE 128</div>'
        + '</div>';
    }
  });
  $('sheet').innerHTML = html;
  $('sheet').querySelectorAll('svg[data-code]').forEach(function(sv){
    try {
      JsBarcode(sv, sv.dataset.code, { format:'CODE128', displayValue:false,
        height:34, width:1.5, margin:0, background:'#ffffff' });
    } catch(e){}
  });
  pintarInfo();
}

// El maestro se carga desde el dashboard (botón 🏷 SKU) y queda compartido
// entre las pantallas del mismo sitio. Aquí solo se lee.
$('q').addEventListener('input', pintarLista);
$('cat').addEventListener('change', pintarLista);
$('copias').addEventListener('input', pintarHoja);
document.querySelectorAll('.seg button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.seg button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    MODO = b.dataset.modo;
    $('fld-copias').style.display = MODO === 'adhesivo' ? 'flex' : 'none';
    pintarHoja();
  });
});
$('btn-todos').addEventListener('click', function(){
  filtrados().forEach(function(r){ SEL[r[0]] = 1; });
  pintarLista(); pintarHoja();
});
$('btn-nada').addEventListener('click', function(){ SEL = {}; pintarLista(); pintarHoja(); });
$('btn-print').addEventListener('click', function(){
  if (!elegidos().length) return alert('Elige al menos un SKU antes de imprimir.');
  window.print();
});

pintarCategorias(); pintarLista(); pintarHoja();
</script>
</body>
</html>
